name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # scan the full history, not only the last commit
          persist-credentials: false

      - name: Block credential files
        run: |
          bad=$(git ls-files | grep -Ei '(^|/)(\.env(\..*)?|_?netrc|\.netrc|credentials(\.json)?)$|\.(pem|p12)$|service-account.*\.json$|-key\.json$' || true)
          if [ -n "$bad" ]; then
            echo "Credential-like files are tracked:"; echo "$bad"; exit 1
          fi

      - name: Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .

  test:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}   # login shell so the conda environment is active
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: rs-trends
          channel-priority: strict
          conda-remove-defaults: "true"
          auto-activate: false

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Pytest
        run: pytest
