# Study configuration. Every threshold, year, and path used by the pipeline lives here.
# Secrets never go in this file. The Earth Engine project ID comes from the EE_PROJECT
# environment variable. The data folder comes from RS_DATA_DIR, falling back to paths.data_dir.

study_area:
  name: "Prairie Parkland (Subtropical) Province 255"
  bailey_province_code: "255"      # Bailey's ecoregion province code
  states: ["TX", "OK"]             # full province, both states

period:
  start_year: 2000
  end_year: 2026                   # set to 2025 in Phase 3 if the 2026 season is incomplete
  land_cover_end_year: 2025        # last Annual NLCD year used for stable pixels

season:
  start_month_day: "03-01"
  end_month_day: "10-31"
  sub_seasons:                     # used by the seasonal coverage rule
    spring: ["03-01", "05-31"]
    summer: ["06-01", "08-31"]
    fall: ["09-01", "10-31"]

sensors:
  # Earth Engine collection IDs, Collection 2 Tier 1 Level-2 surface reflectance
  LT05: {collection: "LANDSAT/LT05/C02/T1_L2", start: "2000-01-01", end: "2011-12-31", family: "TM"}
  LE07: {collection: "LANDSAT/LE07/C02/T1_L2", start: "2000-01-01", end: "2019-12-31", family: "ETM"}
  LC08: {collection: "LANDSAT/LC08/C02/T1_L2", start: "2013-01-01", end: "2026-12-31", family: "OLI"}
  LC09: {collection: "LANDSAT/LC09/C02/T1_L2", start: "2021-10-31", end: "2026-12-31", family: "OLI"}
  landsat7_cutoff: "2020-01-01"    # Landsat 7 excluded on and after this date (orbit drift)

harmonization:
  method: "rma"                    # reduced major axis regression
  bands: ["red", "nir"]
  sample_pixels: 30000             # stratified random sample of stable pixels
  etm_to_oli_fit_years: [2013, 2017]   # Landsat 7 still in maintained orbit
  tm_to_etm_fit: "per_year"        # one TM to ETM+ fit per year, 2000-2011
  comparison: "roy2016"            # comparison run with Roy et al. (2016) coefficients

indices:
  primary: "evi2"
  checks: ["nirv", "kndvi"]
  storage_scale: 10000             # indices stored as int16 = round(value * scale)

validity:
  min_clear_obs_per_year: 4
  min_sub_seasons_covered: 2       # of 3 sub-seasons with at least one clear observation
  min_valid_years: 20              # of the full record
  endpoint_window_years: 5         # first and last N years of the record
  min_valid_years_per_endpoint: 3  # valid years required in each endpoint window

trend:
  fdr_q: 0.10                      # Benjamini-Hochberg level, twice the target alpha (Wilks 2016)
  fdr_q_sensitivity: 0.05
  baseline_years: [2000, 2004]     # baseline mean for percent change
  power: 0.80                      # for the minimum detectable trend
  jackknife_indices: ["evi2"]      # leave-one-year-out check on EVI2 only

land_cover:
  stable_min_confidence: null      # set in Phase 3 after reading the Annual NLCD user guide

drought:
  spei_scales_months: [1, 3, 6, 9, 12]

grid:
  crs: "EPSG:5070"                 # CONUS Albers Equal Area, same grid as Annual NLCD
  resolution_m: 30

compute:
  chunk_size_px: 512
  dask_workers: 4
  memory_limit_per_worker: "3GB"

export:
  batch_years: 5
  drive_folder_prefix: "rs_trends_"

paths:
  data_dir: "C:/rsdata"            # overridden by the RS_DATA_DIR environment variable
  subdirs: ["incoming", "raw", "interim", "outputs", "logs"]
