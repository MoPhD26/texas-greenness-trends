# Study configuration. Every threshold, year, and path used by the pipeline lives here.
# Secrets never go in this file. The Earth Engine project ID comes from the EE_PROJECT
# environment variable. The data folder comes from RS_DATA_DIR, falling back to paths.data_dir.

study_area:
  name: "Prairie Parkland (Subtropical) Province 255"
  bailey_province_code: "255"      # Bailey's ecoregion province code
  states: ["TX", "OK"]             # full province, both states
  # Province 255 exists only in the 2007 ECOMAP release. The 2025 release reorganized
  # the hierarchy and has no province 255. Citation: Cleland et al. (2007), GTR WO-76D,
  # https://doi.org/10.2737/WO-GTR-76D
  source_url: "https://data.fs.usda.gov/geodata/edw/edw_resources/shp/Ecosys_EcoMapProvinces_2007.zip"
  source_sha256: "6f4463d053a3ca6a36d5a642bbbe4fbb09a9d66576047c1ed789e149f5affd91"
  code_field: "MAP_UNIT_S"

period:
  start_year: 2000
  end_year: 2026                   # set to 2025 in Phase 3 if the 2026 season is incomplete
  land_cover_end_year: 2025        # last Annual NLCD year used for stable pixels

season:
  start_month_day: "03-01"
  end_month_day: "10-31"
  sub_seasons:                     # used by the seasonal coverage rule
    spring: ["03-01", "05-31"]
    summer: ["06-01", "08-31"]
    fall: ["09-01", "10-31"]

sensors:
  # Earth Engine collection IDs, Collection 2 Tier 1 Level-2 surface reflectance
  LT05: {collection: "LANDSAT/LT05/C02/T1_L2", start: "2000-01-01", end: "2011-12-31", family: "TM"}
  LE07: {collection: "LANDSAT/LE07/C02/T1_L2", start: "2000-01-01", end: "2019-12-31", family: "ETM"}
  LC08: {collection: "LANDSAT/LC08/C02/T1_L2", start: "2013-04-11", end: "2026-12-31", family: "OLI"}
  LC09: {collection: "LANDSAT/LC09/C02/T1_L2", start: "2021-10-31", end: "2026-12-31", family: "OLI"}
  landsat7_cutoff: "2020-01-01"    # Landsat 7 excluded on and after this date (orbit drift)
  # LC08 starts April 11, 2013, the date Landsat 8 reached its operational orbit (NASA HLS)

qa:
  max_atmos_opacity: 0.3           # TM and ETM+ SR_ATMOS_OPACITY, scaled. Above 0.3 is hazy (EE catalog)
  drop_high_aerosol: true          # OLI SR_QA_AEROSOL level 3 (USGS cautions against these pixels)
  max_scene_cloud_cover_land: 90   # skip scenes above this CLOUD_COVER_LAND percent (cost cut)

harmonization:
  method: "rma"                    # reduced major axis regression
  bands: ["red", "nir"]
  sample_pixels: 10000             # stratified random sample of stable pixels, in clusters
  clusters: {n: 200, box_px: 64}   # 200 random grid-aligned boxes of 64 x 64 px (1.92 km)
  etm_to_oli_fit_years: [2013, 2017]   # Landsat 7 still in maintained orbit
  tm_to_etm_fit: "per_year"        # one TM to ETM+ fit per year, 2000-2011
  comparison: "roy2016"            # comparison run with Roy et al. (2016) coefficients
  stable_years: [2000, 2017]       # sample pixels have one Annual NLCD class through these years
  exclude_classes: [11, 12]        # open water, perennial ice and snow
  min_points_per_class: 300        # floor in the area-proportional stratified sample
  min_clear_obs_per_sensor: 10     # a point enters a fit only if both sensors have this many
  n_boot: 1000                     # cluster bootstrap resamples for confidence intervals
  seed: 2026
  # Roy et al. (2016) Table 2, ETM+ to OLI surface reflectance (OLI = intercept + slope * ETM+).
  # Open access: https://pmc.ncbi.nlm.nih.gov/articles/PMC6999663/ (doi 10.1016/j.rse.2015.12.024).
  # OLS values match the Earth Engine community harmonization tutorial. RMA values were read from
  # the PMC page text and still need a check against the printed table.
  roy2016_ols:
    red: {slope: 0.9047, intercept: 0.0061}
    nir: {slope: 0.8462, intercept: 0.0412}
  roy2016_rma:
    red: {slope: 0.9825, intercept: -0.0022}
    nir: {slope: 1.0073, intercept: -0.0021}

indices:
  primary: "evi2"
  checks: ["nirv", "kndvi"]
  storage_scale: 10000             # indices stored as int16 = round(value * scale)

validity:
  min_clear_obs_per_year: 4
  min_sub_seasons_covered: 2       # of 3 sub-seasons with at least one clear observation
  min_valid_years: 20              # of the full record
  endpoint_window_years: 5         # first and last N years of the record
  min_valid_years_per_endpoint: 3  # valid years required in each endpoint window

trend:
  fdr_q: 0.10                      # Benjamini-Hochberg level, twice the target alpha (Wilks 2016)
  fdr_q_sensitivity: 0.05
  baseline_years: [2000, 2004]     # baseline mean for percent change
  power: 0.80                      # for the minimum detectable trend
  hr_acf_alpha: 0.05               # significance level for lag autocorrelations in Hamed-Rao
  jackknife_indices: ["evi2"]      # leave-one-year-out check on EVI2 only

land_cover:
  stable_min_confidence: null      # set in Phase 3 after reading the Annual NLCD user guide

drought:
  spei_scales_months: [1, 3, 6, 9, 12]

grid:
  # Annual NLCD native grid. Its CRS is Albers Equal Area on a WGS84 datum (not EPSG:5070,
  # which uses NAD83). The export grid is read from this image so pixels align exactly.
  reference_image: "projects/sat-io/open-datasets/USGS/ANNUAL_NLCD/LANDCOVER/Annual_NLCD_LndCov_2025_CU_C1V2"
  crs_transform: [30, 0, -2415585, 0, -30, 3314805]
  resolution_m: 30

land_cover_collection: "projects/sat-io/open-datasets/USGS/ANNUAL_NLCD/LANDCOVER"

compute:
  chunk_size_px: 512
  dask_workers: 4
  memory_limit_per_worker: "3GB"

export:
  batch_years: 5
  drive_folder_prefix: "rs_trends_"
  pilot_year: 2012
  nodata: -32768                   # all bands exported as int16, counts included
  file_dimensions: 32768           # max tile edge in pixels per output GeoTIFF
  filter_buffer_m: 1000            # scenes are filtered by the province outline plus this buffer
  main_indices: ["evi2"]           # province-wide index bands. NIRv and kNDVI run on a sample.
  # Single-sensor subsets, folded into the yearly tasks as extra bands (sensitivity check a)
  subsets:
    etm: {family: "ETM", years: [2000, 2019]}
    oli: {family: "OLI", years: [2013, 2019]}

index_checks:
  indices: ["nirv", "kndvi"]
  sample_fraction: 0.10            # share of 512 x 512 chunks, drawn at random
  seed: 2026

paths:
  data_dir: "C:/rsdata"            # overridden by the RS_DATA_DIR environment variable
  subdirs: ["incoming", "raw", "interim", "outputs", "logs"]

budget:
  monthly_quota_eecu_h: 1000       # Earth Engine Contributor tier (switched 2026-11-26)
  stop_at_eecu_h: 850              # stop and ask if planned work would push the month past this
