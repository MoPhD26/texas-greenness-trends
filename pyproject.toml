[project]
name = "rstrends"
version = "0.1.0"
description = "Landsat greenness trends in Bailey's Province 255, Texas and Oklahoma, 2000-2026"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Numbered pipeline scripts are run directly, not imported, so digit-led names are fine.
"src/[0-9][0-9]_*.py" = ["E402"]
